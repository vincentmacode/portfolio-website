name: Auto-close linked issues

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced by this pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # Collect every place an issue reference can hide: the PR title, the
          # PR body, and each commit message on the branch.
          commits=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json commits --jq '.commits[] | .messageHeadline + "\n" + .messageBody')
          haystack=$(printf '%s\n%s\n%s\n' "$PR_TITLE" "$PR_BODY" "$commits")

          # Closing keywords GitHub itself honours, e.g. "Closes #54", "fixed: #7".
          keyword_issues=$(printf '%s' "$haystack" | grep -oiE \
            '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]*#[0-9]+' \
            | grep -oE '[0-9]+$' || true)

          # Branch names that lead with the issue number: 54-foo, issue-54, fix/54-foo.
          branch_issues=$(printf '%s' "$PR_BRANCH" | grep -oiE \
            '(^|/)(issue[-_]?)?[0-9]+([-_]|$)' \
            | grep -oE '[0-9]+' || true)

          all=$(printf '%s\n%s\n' "$keyword_issues" "$branch_issues" \
            | grep -E '^[0-9]+$' | sort -un || true)

          if [ -z "$all" ]; then
            echo "No linked issues found for PR #$PR_NUMBER."
            exit 0
          fi

          for issue in $all; do
            state=$(gh issue view "$issue" --repo "$REPO" --json state --jq .state 2>/dev/null || echo MISSING)
            case "$state" in
              OPEN)
                echo "Closing issue #$issue."
                gh issue close "$issue" --repo "$REPO" \
                  --comment "Closed automatically: merged in #$PR_NUMBER."
                ;;
              CLOSED)
                echo "Issue #$issue is already closed; skipping."
                ;;
              *)
                echo "Issue #$issue not found; skipping."
                ;;
            esac
          done
